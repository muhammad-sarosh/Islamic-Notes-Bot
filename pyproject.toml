[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "islamic-notes-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "discord.py>=2.5,<3", "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3", "markdown-it-py>=3,<5", "bleach>=6.2,<7",
]

[project.optional-dependencies]
worker = ["yt-dlp[default]>=2026.3.3", "numpy>=2,<3", "sentence-transformers>=3,<6", "transformers>=4.45,<5", "torch>=2.5,<3"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["notes_bot*"]

[tool.setuptools.package-data]
notes_bot = ["schema.sql", "templates/*.html", "static/*", "defaults/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
